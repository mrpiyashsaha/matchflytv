<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matchflyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d8d" />
      <stop offset="60%" stop-color="#d91b72" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff80bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff2d8d" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#matchflyBg)" />

  <!-- Gloss Top Highlight -->
  <path d="M 16 126 C 16 65 65 16 126 16 L 386 16 C 447 16 496 65 496 126 L 496 220 C 380 240 130 260 16 180 Z" fill="url(#glossGrad)" />

  <!-- Inner Stroke -->
  <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="url(#borderGlow)" stroke-width="8" />

  <!-- Stylized Brand M -->
  <path
    d="M 104 390 L 104 148 C 104 132 120 122 134 130 L 256 216 L 378 130 C 392 122 408 132 408 148 L 408 390 C 408 400 398 408 388 408 L 348 408 C 338 408 330 400 330 390 L 330 248 L 268 292 C 260 297 252 297 244 292 L 182 248 L 182 390 C 182 400 174 408 164 408 L 124 408 C 114 408 104 400 104 390 Z"
    fill="#ffffff"
    filter="url(#badgeShadow)"
  />

  <!-- TV Badge on Bottom Right -->
  <g filter="url(#badgeShadow)">
    <rect x="276" y="308" width="148" height="84" rx="22" fill="#0f172a" stroke="#ff2d8d" stroke-width="6" />
    <text x="350" y="367" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">TV</text>
  </g>
</svg>
